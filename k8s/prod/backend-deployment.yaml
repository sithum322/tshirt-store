apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: sithum322/tshirt-backend:latest
        ports:
        - containerPort: 5000

        env:
        - name: DB_HOST
          value: mysql.database.svc.cluster.local

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: backend-db-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-db-secret
              key: DB_PASSWORD

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: backend-db-secret
              key: DB_NAME